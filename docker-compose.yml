version: '3.1'
services:
  dbpostgresql:
    container_name: dbpostgresql
    image: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=123123123
      - POSTGRES_USER=cleverpy
      - POSTGRES_DB=movies
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleverpy"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    container_name: cleverpySpringBoot
    image: app-springboot-postgresql
    build: ./
    ports:
      - "8080:8080"
    depends_on:
      dbpostgresql:
        condition: service_healthy

